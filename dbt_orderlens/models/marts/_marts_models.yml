version: 2

models:
  # ===========================================================================
  # DIMENSIONS
  # ===========================================================================

  - name: dim_customers
    description: >
      One row per PERSON, keyed on customer_unique_id. 96,096 rows.

      Solves risk R-1. The bespoke test assert_repeat_customers_exist is the one
      that matters here: keying this model on customer_id instead would produce a
      perfectly unique key and pass every test below while reporting a 100%
      first-time customer base.
    columns:
      - name: customer_unique_id
        tests: [unique, not_null]
      - name: total_orders
        tests: [not_null]
      - name: is_repeat_customer
        description: True for 2,997 people. See assert_repeat_customers_exist.
        tests: [not_null]
      - name: cohort_month
        tests: [not_null]
      - name: first_order_at
        tests: [not_null]
      - name: recency_days
        description: Days from last order to the 2018-08-31 anchor (M2 D-5).
        tests: [not_null]
      - name: region
        tests:
          - accepted_values:
              values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]

  - name: dim_products
    description: >
      One product. 32,951 rows — every one of them, including the 623 that never
      reach an English category. An INNER JOIN to the lookup would delete
      R$185,049.76 of item revenue and look clean doing it (M2 F-05).
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category
        description: >
          Never null — guaranteed by the three-step coalesce. This test proves the
          coalesce works rather than asserting a property of the source.
        tests: [not_null]
      - name: category_source
        description: Which coalesce step fired. 32,328 / 13 / 610.
        tests:
          - not_null
          - accepted_values:
              values: [translated, portuguese_fallback, missing]

  - name: dim_sellers
    description: One seller. 3,095 rows, 7 of them without coordinates (M2 F-07).
    columns:
      - name: seller_id
        tests: [unique, not_null]
      - name: state
        tests: [not_null]
      - name: has_coordinates
        tests: [not_null]
      - name: region
        tests:
          - accepted_values:
              values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]

  - name: dim_geography
    description: >
      One ZIP prefix. 19,010 rows. Inherits the killed fan-out from
      stg_geolocation; the uniqueness test here asserts nothing reintroduced it.
    columns:
      - name: zip_prefix
        tests: [unique, not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]
      - name: region
        tests:
          - accepted_values:
              values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]

  - name: dim_dates
    description: >
      One calendar date, GENERATED across the observed range — not observed.
      November 2016 has no orders at all (M2 F-06), and a spine built from order
      dates would omit it and draw a trend line through a month that never
      existed.
    columns:
      - name: date_day
        tests: [unique, not_null]
      - name: year_month
        tests: [not_null]
      - name: in_trend_window
        description: Marks the 2017-01 to 2018-08 full-coverage period.
        tests: [not_null]

  # ===========================================================================
  # FACTS
  # ===========================================================================

  - name: fct_orders
    description: >
      One order. ALL 99,441 — the ineligible ones carry null delivery measures
      rather than being filtered out, because "how many orders never arrived" is
      BQ-1 and a fact table that already dropped them cannot answer it.

      96,470 are delivery-eligible. 6,534 (6.77%) are late under the calendar-day
      rule settled in M2 F-01 — not the 7,826 (8.11%) the timestamp rule would
      report.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_unique_id
        description: The PERSON, not the per-order customer_id. Risk R-1.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id
      - name: purchase_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_day
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced,
                       processing, created, approved]
      - name: is_delivery_eligible
        description: status = delivered AND delivered_at is not null. Both (M2 D-2).
        tests: [not_null]
      - name: delay_days
        description: >
          Signed WHOLE days, positive = late. The project's central independent
          variable. See assert_delay_days_is_whole_days — the test exists because
          nothing else catches a reversion to timestamp arithmetic.
      - name: order_value
        description: >
          NULL, not 0, for the 775 orders with no items (M2 F-04). Zero would claim
          the order was worth nothing and would drag every average down.
      - name: review_count
        tests: [not_null]
      - name: seller_count
        description: "Greater than 1 on 1,278 orders, which is why BQ-4 filters on is_single_seller."

  - name: fct_order_items
    description: >
      One item within an order. 112,650 rows. The model BQ-4's seller ranking
      reads, because an order-level delivery outcome cannot be attributed to each
      of several sellers without double-counting (M2 F-12).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: price
        tests: [not_null]
      - name: item_value
        tests: [not_null]

  - name: fct_payments
    description: >
      One payment instrument per order. 103,886 rows. Kept separate precisely
      because summing it into fct_orders would double-count installment interest
      and split payments (M2 F-10).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value
        tests: [not_null]

  # ===========================================================================
  # ANALYSIS MARTS (M4) — aggregation lives in SQL, not in a notebook cell.
  # SRS §9.2: Python is reserved for statistics and modelling. Every descriptive
  # figure published in M4 is a select against one of these five models.
  # ===========================================================================

  - name: mart_delivery_monthly
    description: >
      FR-5 — delivery performance by purchase month, restricted to the 2017-01 to
      2018-08 full-coverage window (M2 F-06). 20 rows.

      The handover/transit split is what makes the eventual recommendation
      actionable: the carrier owns roughly three quarters of the wait, and both
      late-rate spikes are carrier-side while seller handover barely moves.
    columns:
      - name: year_month
        tests: [unique, not_null]
      - name: delivered_orders
        tests: [not_null]
      - name: pct_late
        tests: [not_null]
      - name: mean_carrier_transit_days
        tests: [not_null]

  - name: mart_delay_buckets
    description: >
      FR-5 — the delay distribution and what each band costs in satisfaction.
      8 rows.

      Buckets rather than a mean because the relationship is sharply non-linear.
      pct_reviewed_before_delivery is the column to read twice: it climbs from
      0.2% on on-time orders to over 96% on every late band, which makes review
      timing a consequence of the delay rather than an independent nuisance.
    columns:
      - name: delay_bucket
        tests: [unique, not_null]
      - name: orders
        tests: [not_null]
      - name: pct_of_delivered
        tests: [not_null]

  - name: mart_cohort_retention
    description: >
      FR-6 — retention by first-purchase month, keyed on customer_unique_id
      (risk R-1) and counted in SHOPPING DAYS rather than orders, because 897 of
      2,997 repeat customers placed their second order the same day.

      The curve is flat at well under 1%. That is the finding, not a defect
      (SRS NFR-8).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cohort_month, months_since_first_order]
    columns:
      - name: cohort_month
        tests: [not_null]
      - name: months_since_first_order
        tests: [not_null]
      - name: cohort_customers
        tests: [not_null]
      - name: retention_pct
        tests: [not_null]

  - name: mart_customer_rfm
    description: >
      FR-7 — RFM per person. 96,096 rows, one per customer_unique_id.

      The frequency dimension is degenerate: 96.88% of people placed exactly one
      order, so f_score takes only the values 1, 3 and 5 and carries almost no
      information. Scoring it into quintiles would have manufactured five
      segments that differ in nothing. The segmentation leans on R and M, and
      f_score is carried so the degeneracy is visible in the output.
    columns:
      - name: customer_unique_id
        tests: [unique, not_null]
      - name: r_score
        tests:
          - not_null
          - accepted_values: {values: [1, 2, 3, 4, 5], quote: false}
      - name: f_score
        description: Only ever 1, 3 or 5 — see the model description.
        tests:
          - not_null
          - accepted_values: {values: [1, 3, 5], quote: false}
      - name: m_score
        tests:
          - not_null
          - accepted_values: {values: [1, 2, 3, 4, 5], quote: false}
      - name: monetary_value
        tests: [not_null]
      - name: rfm_segment
        tests:
          - not_null
          - accepted_values:
              values: ['Champions', 'Recent, promising', 'Recent, low value',
                       'Needs attention', 'At risk, high value',
                       'Lost, low value', 'Hibernating']

  - name: mart_revenue_concentration
    description: >
      FR-8 — revenue ranked by category, seller and customer state, with
      cumulative share for Pareto analysis. 3,196 rows across three dimensions.

      Category and seller revenue are measured at ITEM grain because an order can
      span several of each; state revenue at order grain. Seller late rates use
      single-seller orders only (M2 F-12) — blaming every seller in a
      multi-seller order for one delivery outcome would double-count the damage.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [dimension, dimension_key]
    columns:
      - name: dimension
        tests:
          - not_null
          - accepted_values: {values: [category, seller, customer_state]}
      - name: dimension_key
        tests: [not_null]
      - name: revenue
        tests: [not_null]
      - name: revenue_rank
        tests: [not_null]
      - name: cumulative_pct_of_revenue
        tests: [not_null]

  - name: mart_order_analysis
    description: >
      The modelling table for M5 and M6. One row per delivery-eligible order —
      96,470 rows, 95,824 of them carrying a review.

      FR-11 requires the delay effect to be estimated controlling for price,
      freight, category, seller state, customer state and season, and none of
      those live on fct_orders. Design Phase §8: a missing control is a new mart
      column, not an ad-hoc join in a script.

      PRIMARY ITEM ATTRIBUTION — category, seller and product attributes come
      from the highest-priced item in the order, tie-broken on product_id. That
      is a choice, not a fact; is_single_seller and product_count are carried so
      any analysis can restrict to the unambiguous cases.

      M6 LEAKAGE — the columns marked post-delivery below may NOT be used by the
      classifier. Everything else is known at purchase time.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id
      - name: review_score
        description: "Outcome. Null on 646 orders that were never reviewed."
      - name: delay_days
        description: "POST-DELIVERY — treatment, off-limits to M6."
        tests: [not_null]
      - name: is_late
        description: "POST-DELIVERY — off-limits to M6."
        tests: [not_null]
      - name: delivery_days
        description: "POST-DELIVERY — off-limits to M6."
      - name: seller_handover_days
        description: "POST-DELIVERY — off-limits to M6."
      - name: carrier_transit_days
        description: "POST-DELIVERY — off-limits to M6."
      - name: estimated_days
        description: "Known at purchase — the promise shown to the customer."
        tests: [not_null]
      - name: distance_km
        description: >
          Great-circle km between customer and seller centroids. Null on 475
          orders whose ZIP prefix has no centroid (M2 F-07); the regression drops
          those rows and reports how many.
      - name: primary_category
        tests: [not_null]
      - name: seller_state
        tests: [not_null]
      - name: customer_state
        tests: [not_null]
      - name: season
        description: Southern hemisphere. Getting this backwards would invert every seasonal coefficient.
        tests:
          - not_null
          - accepted_values: {values: [summer, autumn, winter, spring]}
      - name: order_item_total
        tests: [not_null]

  - name: mart_prediction_features
    description: >
      The M6 feature table. One delivery-eligible order carrying a review —
      95,824 rows. EVERY COLUMN IS KNOWN AT PURCHASE TIME; that is the model's
      whole claim, and analysis/predictive.py asserts it again against a denylist
      before a model sees anything.

      The seller track-record columns are computed AS-OF the purchase timestamp.
      A naive `avg(is_late) group by seller` would include this order's own
      outcome and every future order's — a catastrophic leak that would look
      excellent in backtest and be unavailable in production. Late rates count
      prior orders DELIVERED before this one was purchased; low-score rates count
      prior reviews ANSWERED before it, because a review that exists but has not
      been written yet is not information anyone had.

      Built as an event-stream window rather than a correlated subquery: the
      obvious form takes ~21 minutes over 96k rows, this takes seconds.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: is_low_score
        description: The target. 12.81% of rows.
        tests: [not_null]
      - name: estimated_days
        description: The promise shown at purchase — known pre-delivery.
        tests: [not_null]
      - name: seller_prior_deliveries
        description: Seller's orders delivered before this one was purchased. 0 for a seller's first.
        tests: [not_null]
      - name: seller_prior_late_rate
        description: >
          Null where the seller had no prior delivery — 5,230 orders. Null, not 0:
          an unknown track record is not a clean one.
      - name: seller_prior_low_score_rate
        description: As above, counted on reviews ANSWERED before this purchase.
      - name: primary_category
        tests: [not_null]
      - name: season
        tests: [not_null]
