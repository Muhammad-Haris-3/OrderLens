version: 2

models:
  # ===========================================================================
  # DIMENSIONS
  # ===========================================================================

  - name: dim_customers
    description: >
      One row per PERSON, keyed on customer_unique_id. 96,096 rows.

      Solves risk R-1. The bespoke test assert_repeat_customers_exist is the one
      that matters here: keying this model on customer_id instead would produce a
      perfectly unique key and pass every test below while reporting a 100%
      first-time customer base.
    columns:
      - name: customer_unique_id
        tests: [unique, not_null]
      - name: total_orders
        tests: [not_null]
      - name: is_repeat_customer
        description: True for 2,997 people. See assert_repeat_customers_exist.
        tests: [not_null]
      - name: cohort_month
        tests: [not_null]
      - name: first_order_at
        tests: [not_null]
      - name: recency_days
        description: Days from last order to the 2018-08-31 anchor (M2 D-5).
        tests: [not_null]
      - name: region
        tests:
          - accepted_values:
              values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]

  - name: dim_products
    description: >
      One product. 32,951 rows — every one of them, including the 623 that never
      reach an English category. An INNER JOIN to the lookup would delete
      R$185,049.76 of item revenue and look clean doing it (M2 F-05).
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category
        description: >
          Never null — guaranteed by the three-step coalesce. This test proves the
          coalesce works rather than asserting a property of the source.
        tests: [not_null]
      - name: category_source
        description: Which coalesce step fired. 32,328 / 13 / 610.
        tests:
          - not_null
          - accepted_values:
              values: [translated, portuguese_fallback, missing]

  - name: dim_sellers
    description: One seller. 3,095 rows, 7 of them without coordinates (M2 F-07).
    columns:
      - name: seller_id
        tests: [unique, not_null]
      - name: state
        tests: [not_null]
      - name: has_coordinates
        tests: [not_null]
      - name: region
        tests:
          - accepted_values:
              values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]

  - name: dim_geography
    description: >
      One ZIP prefix. 19,010 rows. Inherits the killed fan-out from
      stg_geolocation; the uniqueness test here asserts nothing reintroduced it.
    columns:
      - name: zip_prefix
        tests: [unique, not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]
      - name: region
        tests:
          - accepted_values:
              values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]

  - name: dim_dates
    description: >
      One calendar date, GENERATED across the observed range — not observed.
      November 2016 has no orders at all (M2 F-06), and a spine built from order
      dates would omit it and draw a trend line through a month that never
      existed.
    columns:
      - name: date_day
        tests: [unique, not_null]
      - name: year_month
        tests: [not_null]
      - name: in_trend_window
        description: Marks the 2017-01 to 2018-08 full-coverage period.
        tests: [not_null]

  # ===========================================================================
  # FACTS
  # ===========================================================================

  - name: fct_orders
    description: >
      One order. ALL 99,441 — the ineligible ones carry null delivery measures
      rather than being filtered out, because "how many orders never arrived" is
      BQ-1 and a fact table that already dropped them cannot answer it.

      96,470 are delivery-eligible. 6,534 (6.77%) are late under the calendar-day
      rule settled in M2 F-01 — not the 7,826 (8.11%) the timestamp rule would
      report.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_unique_id
        description: The PERSON, not the per-order customer_id. Risk R-1.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id
      - name: purchase_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_day
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced,
                       processing, created, approved]
      - name: is_delivery_eligible
        description: status = delivered AND delivered_at is not null. Both (M2 D-2).
        tests: [not_null]
      - name: delay_days
        description: >
          Signed WHOLE days, positive = late. The project's central independent
          variable. See assert_delay_days_is_whole_days — the test exists because
          nothing else catches a reversion to timestamp arithmetic.
      - name: order_value
        description: >
          NULL, not 0, for the 775 orders with no items (M2 F-04). Zero would claim
          the order was worth nothing and would drag every average down.
      - name: review_count
        tests: [not_null]
      - name: seller_count
        description: "Greater than 1 on 1,278 orders, which is why BQ-4 filters on is_single_seller."

  - name: fct_order_items
    description: >
      One item within an order. 112,650 rows. The model BQ-4's seller ranking
      reads, because an order-level delivery outcome cannot be attributed to each
      of several sellers without double-counting (M2 F-12).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: price
        tests: [not_null]
      - name: item_value
        tests: [not_null]

  - name: fct_payments
    description: >
      One payment instrument per order. 103,886 rows. Kept separate precisely
      because summing it into fct_orders would double-count installment interest
      and split payments (M2 F-10).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value
        tests: [not_null]
