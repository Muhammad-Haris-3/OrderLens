name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # A throwaway warehouse, so CI can run the dbt data tests and not merely
    # check that the project parses (SRS NFR-3).
    #
    # The real dataset is ~120 MB of CSV and is deliberately not committed, so
    # this loads the referentially-complete sample fixture in
    # tests/fixtures/raw_sample instead — 1,550 orders grown outward from a
    # stratified seed until every foreign key resolves. See scripts/make_sample.py
    # for why it is grown rather than sampled row by row.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: ci
      DBT_PASSWORD: ci
      DBT_DBNAME: ci
      DBT_SCHEMA: analytics
      DBT_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Python tests
        run: pytest -q

      - name: Create the raw schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/raw_schema.sql

      - name: Load the sample fixture
        run: python scripts/load_raw.py --data-dir tests/fixtures/raw_sample

      - name: Index the raw layer
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/raw_indexes.sql

      - name: Install dbt packages
        working-directory: dbt_orderlens
        run: dbt deps

      # Builds all 24 models and runs all 193 data tests, including the seven
      # bespoke ones. min_repeat_customers is lowered because the fixture holds
      # 194 repeat customers rather than the warehouse's 2,997 — the assertion
      # still runs, and still catches the failure it exists for (dim_customers
      # keyed on the per-order customer_id yields exactly zero).
      # Block scalar, not a plain one: the --vars payload contains ": ", which
      # YAML reads as a mapping indicator and rejects.
      - name: dbt build
        working-directory: dbt_orderlens
        run: |
          dbt build --profiles-dir . --project-dir . --vars '{min_repeat_customers: 50}'
