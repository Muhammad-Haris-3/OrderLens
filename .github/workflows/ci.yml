name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Install dbt packages
        working-directory: dbt_orderlens
        run: dbt deps

      # `dbt parse` compiles every model, test and macro — Jinja, refs, sources
      # and the dependency graph — without connecting to a warehouse. The
      # credentials below are placeholders that are never used; a profile simply
      # has to exist for the project to load.
      #
      # This step used to end in `|| echo "::warning::"` because no models existed
      # before M3. They exist now, so it fails properly: a broken ref or an
      # unparseable model must not reach main.
      - name: Validate dbt project parses
        working-directory: dbt_orderlens
        env:
          DBT_HOST: localhost
          DBT_USER: ci
          DBT_PASSWORD: ci
          DBT_DBNAME: ci
          DBT_SCHEMA: analytics
          DBT_PORT: "5432"
        run: dbt parse --profiles-dir . --project-dir .

      # NOT run in CI: `dbt build`. It needs the loaded warehouse, and the dataset
      # is ~120 MB of CSV that is not committed (see data/raw/README.md). The data
      # tests run locally against Neon and their result is recorded in the
      # milestone summary. What CI can enforce without data, it does.
