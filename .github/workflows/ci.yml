name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      # dbt models arrive in M3. Once they exist this job gains
      # `dbt build` against a CI warehouse, which runs the models AND the
      # data-quality tests declared in _sources.yml / schema.yml.
      - name: Validate dbt project parses
        working-directory: dbt_orderlens
        env:
          DBT_HOST: localhost
          DBT_USER: ci
          DBT_PASSWORD: ci
          DBT_DBNAME: ci
          DBT_SCHEMA: analytics
          DBT_PORT: "5432"
        run: dbt parse --profiles-dir . --project-dir . || echo "::warning::dbt parse skipped until M3 adds models"
